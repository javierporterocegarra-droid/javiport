thumbnail:
  font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  accent_color: "#FFD400"

upload:
  enabled: true
  privacy: private        # private | unlisted | public
  # Si > 0, el vídeo se sube privado y se programa para publicarse N horas después
  schedule_hours_ahead: 0
  category_id: "27"       # 28 = Ciencia y tecnología, 27 = Educación, 24 = Entretenimiento
  made_for_kids: false
  # Política de YouTube: declarar contenido sintético/alterado realista
  contains_synthetic_media: true
  playlist_id: ""
  post_comment: true      # publica un comentario del canal (para fijarlo a mano)

manage:
  reply_to_comments: true
  max_replies_per_run: 25
  hold_spam_for_review: true
  report_days: 28

claude:
  model: claude-opus-5-5
  effort: high

paths:
  output: output
  database: data/autotube.db
  feedback: data/feedback.md
  client_secret: secrets/client_secret.json
  token: secrets/token.json
