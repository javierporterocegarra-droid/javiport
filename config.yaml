# ==========================================================
#  AutoTube - configuración del canal automatizado
# ==========================================================

channel:
  name: "Tecnología Sin Humo"
  # Nicho del canal: cuanto más concreto, mejor rendimiento y más coherencia.
  niche: "IA y ciberseguridad explicadas para el día a día: cómo funciona la tecnología que usas y cómo protegerte"
  language: es            # idioma de los guiones y metadatos
  region: ES              # país para tendencias de YouTube (ES, MX, AR, US...)
  audience: "hispanohablantes de 18 a 55 años que usan tecnología a diario pero no son expertos"
  tone: "cercano, entusiasta, riguroso, sin clickbait engañoso"
  # Palabras clave semilla para buscar lo que funciona en tu nicho
  keywords:
    - "cómo funciona la inteligencia artificial"
    - "estafas con inteligencia artificial"
    - "ciberseguridad para principiantes"
    - "privacidad en el móvil"
  # Temas que NUNCA debe tratar
  banned_topics:
    - política partidista
    - consejos médicos o financieros personalizados

video:
  format: long            # long (16:9, varios minutos) | short (9:16, <60 s)
  target_minutes: 8       # solo para format: long
  fps: 30
  subtitles: true
  music_dir: assets/music # pon aquí .mp3 libres de derechos; se elige uno al azar
  music_volume: 0.08
  # stock = vídeos de Pexels | cards = gráficos animados | auto = Pexels si hay clave, si no gráficos
  visuals: auto
  theme_color: "#22D3EE"

tts:
  engine: kokoro          # kokoro (gratis, local) | edge (gratis, online) | elevenlabs (de pago, la mejor)
  kokoro_voice: em_alex   # em_alex / em_santa (hombre), ef_dora (mujer)
  kokoro_speed: 1.05
  voice: es-ES-AlvaroNeural   # para edge: es-MX-JorgeNeural, es-ES-ElviraNeural, es-MX-DaliaNeural
  rate: "+6%"
  elevenlabs_voice_id: ""
  # Cómo debe pronunciar la voz palabras en inglés o siglas (solo afecta al audio)
  pronunciations:
    ChatGPT: "chat yi pi ti"
    GPT: "yi pi ti"
    OpenAI: "open ei ai"
    passkeys: "páskis"
    passkey: "páski"
    Passkeys: "Páskis"
    Passkey: "Páski"
    deepfakes: "dipfeiks"
    deepfake: "dipfeik"
    Deepfakes: "Dipfeiks"
    WhatsApp: "guasap"
    Google: "gúgol"
    iPhone: "aifon"
    Android: "ándroid"
    FBI: "efe be i"
    IA: "i a"
    Face ID: "feis ai di"
    Arup: "Árup"
    Bluetooth: "blutuz"
    phishing: "fishing"
    transformer: "transfórmer"
    Transformer: "Transfórmer"
    GPT-3: "yi pi ti tres"
    Microsoft: "Maicrosoft"
    Apple: "Ápel"
    PayPal: "Peipal"
    iCloud: "ai claud"
    Hong Kong: "Jong Kong"
    QR: "cu erre"
    SMS: "ese eme ese"
    Chrome: "crom"
    Windows: "uíndous"
    iPad: "aipad"
    CEO: "ceo"

thumbnail:
  font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  accent_color: "#FFD400"

upload:
  enabled: true
  privacy: private        # private | unlisted | public
  # Si > 0, el vídeo se sube privado y se programa para publicarse N horas después
  schedule_hours_ahead: 0
  category_id: "28"       # 28 = Ciencia y tecnología, 27 = Educación, 24 = Entretenimiento
  made_for_kids: false
  # Política de YouTube: declarar contenido sintético/alterado realista
  contains_synthetic_media: true
  playlist_id: ""
  post_comment: true      # publica un comentario del canal (para fijarlo a mano)

manage:
  reply_to_comments: true
  max_replies_per_run: 25
  hold_spam_for_review: true
  report_days: 28

claude:
  model: claude-opus-5-5
  effort: high

paths:
  output: output
  database: data/autotube.db
  feedback: data/feedback.md
  client_secret: secrets/client_secret.json
  token: secrets/token.json
