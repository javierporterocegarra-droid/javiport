# ==========================================================
#  AutoTube - configuración del canal automatizado
# ==========================================================

channel:
  name: "TecnoHistoria"
  # Nicho del canal: cuanto más concreto, mejor rendimiento y más coherencia.
  niche: "historia de la tecnología: los inventos, las personas y los momentos que cambiaron el mundo, contados como una historia"
  language: es            # idioma de los guiones y metadatos
  region: ES              # país para tendencias de YouTube (ES, MX, AR, US...)
  audience: "hispanohablantes de 18 a 60 años curiosos por la historia y la tecnología"
  tone: "narrativo y con suspense, como un buen documental; riguroso con las fechas y los datos"
  # Palabras clave semilla para buscar lo que funciona en tu nicho
  keywords:
    - "historia de la tecnología"
    - "historia de la informática"
    - "inventos que cambiaron el mundo"
    - "historia de internet"
  # Temas que NUNCA debe tratar
  banned_topics:
    - política partidista
    - consejos médicos o financieros personalizados

video:
  format: long            # long (16:9, varios minutos) | short (9:16, <60 s)
  target_minutes: 8       # solo para format: long
  fps: 30
  subtitles: true
  music_dir: assets/music # pon aquí .mp3 libres de derechos; se elige uno al azar
  music_volume: 0.08
  # Contacto que Wikimedia exige en las descargas automáticas de fotos históricas
  contact_url: "https://www.youtube.com/@tecnohistoria-1"
  photos: true            # usar fotos de Wikimedia Commons (licencias libres, con créditos)
  # stock = vídeos de Pexels | cards = gráficos animados | auto = Pexels si hay clave, si no gráficos
  visuals: auto
  theme_color: "#F5B942"

tts:
  engine: edge            # edge (voces neuronales de Microsoft, gratis) | kokoro (local, más robótica) | elevenlabs (de pago)
  kokoro_voice: em_alex   # em_alex / em_santa (hombre), ef_dora (mujer)
  kokoro_speed: 1.05
  voice: es-ES-AlvaroNeural   # edge: es-MX-JorgeNeural, es-ES-XimenaNeural, es-US-AlonsoNeural...
  rate: "+4%"
  elevenlabs_voice_id: ""
  # Pronunciación para la voz edge (solo afecta al audio): basta con algunas siglas
