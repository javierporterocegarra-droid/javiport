name: AutoTube autopilot

on:
  schedule:
    - cron: "17 15 * * *"   # todos los días a las 15:17 UTC (cámbialo a tu gusto)
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema concreto (vacío = elegir por tendencias)"
        required: false

permissions:
  contents: write

concurrency:
  group: autotube
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar credenciales de YouTube
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YT_CLIENT_SECRET_JSON" > secrets/client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > secrets/token.json

      - name: Ejecutar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python -m autotube manage || true
            python -m autotube create --topic "${{ github.event.inputs.topic }}"
          else
            python -m autotube autopilot
          fi

      - name: Guardar vídeo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotube-output
          path: |
            output/**/video.mp4
            output/**/thumbnail.jpg
            output/**/*.json
            output/**/research.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar historial del canal
        if: always()
        run: |
          git config user.name "autotube-bot"
          git config user.email "autotube-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "autotube: actualizar historial [skip ci]"
          git push
